<svg width="720" height="180" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#0058b3"/>
    </linearGradient>
  </defs>

  <!-- Icona (badge arrotondato con i tre nodi connessi) -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="180" height="180" rx="40" fill="url(#bgGrad)"/>
    <g stroke="#ffffff" stroke-width="8" stroke-linecap="round">
      <line x1="90" y1="53" x2="64" y2="108"/>
      <line x1="90" y1="53" x2="116" y2="108"/>
      <line x1="64" y1="108" x2="116" y2="108"/>
    </g>
    <circle cx="90" cy="53" r="19" fill="#ffffff"/>
    <circle cx="64" cy="108" r="19" fill="#ffffff"/>
    <circle cx="116" cy="108" r="19" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="204" y="115" font-family="Inter" font-weight="700" font-size="72"
        letter-spacing="-2" fill="#1d1d1f">Team<tspan fill="#0071e3">Craft</tspan></text>
</svg>
